[mod-setting-description]
pf-overclocked-modules=Adds overclocked modules which are more powerful but wear out over time. As this requires spoilage mechanics, this setting only does anything if either Space Age or Enable All Feature Flags are installed.

[tips-and-tricks-item-name]
new-beacon-mechanics=New beacon mechanics
overclocked-modules=Overclocked modules

[tips-and-tricks-item-description]
new-beacon-mechanics=Multiple beacons of the same type (mostly) do not stack when affecting the same production machine. To stack module effects, use different types of beacons.\n[entity=beacon] is mostly unchanged, but its transmission efficiency is reduced.\n[entity=breaker-box] has a large area of effect and does not require power, but can only transmit efficiency modules.\n[entity=torment-nexus] is a powerful late-game beacon with a very large area of effect. It also acts as a roboport.\n[entity=external-drive-unit] must be placed directly adjacent to machines, consumes lubricant to operate, and can only transmit speed modules. Unlike other beacon types, up to 4 can boost the same machine.
overclocked-modules=Overclocked modules are more powerful than normal modules, but have a limited lifespan and must be periodically refurbished. Their replacement can only be automated when used in beacons.\n[item=overclocked-speed-module] has a huge speed boost and no quality penalty.\n[item=overclocked-quality-module] is the only quality module that can be used in beacons. It also has no speed penalty.\n[item=overclocked-efficiency-module] has extreme energy consumption and pollution reductions as well as a small speed boost. It also has a much longer lifespan than other overclocked modules.\nOverclocked modules will not start spoiling in the output slot of an assembler.

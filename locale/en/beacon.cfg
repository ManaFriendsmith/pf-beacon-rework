[technology-description]
breaker-box=Simple electricity throttling system. Applies efficiency modules over a wide area. Does not consume electricity itself.
superstation=Miniaturization allows the integration of breaker boxes into substations.
external-drive-unit=Secondary electric engines provide additional torque to adjacent machines. Applies a single additional speed module at the cost of lubricant. Up to 4 can benefit the same machine at once.
torment-nexus=Quantum supercomputer hosting an artificial intelligence that can manage entire subfactories. Exists in a state of perpetual agony.

overclocked-efficiency-module=Improved efficiency module with a minor speed bonus. Will eventually need to be refurbished.
overclocked-speed-module=Improved speed module which does not impact quality. Will eventually need to be refurbished.
overclocked-quality-module=Improved quality module which does not impact speed and can be used in beacons. Will eventually need to be refurbished.


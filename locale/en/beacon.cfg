[entity-description]
breaker-box=Transmits the effects of efficiency modules to nearby machines. The effect of multiple breaker boxes do not stack and will be averaged. Higher qualities increase range.
superstation=Provides electric power and transmits the effects of efficiency modules to nearby machines. The effect of multiple superstations do not stack and will be averaged, but do stack with freestanding breaker boxes. Higher qualities increase range.
external-drive-unit=Transmits the effects of a single speed module to adjacent machines. Up to 4 can benefit the same machine at once. Consumes electricity and lubricant to function. Higher qualities reduce energy and lubricant usage.
beacon=Transmits the effects of modules to nearby friendly entities. The effects of multiple beacons do not stack and will be averaged.
torment-nexus=Transmits the effects of modules to nearby friendly entities. The effects of multiple torment nexi do not stack and will be averaged. Contains an integrated logistic zone expander and robot charging station.

